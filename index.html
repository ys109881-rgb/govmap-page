<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>GovMap API bridge</title>
  <script>
    // Relays GovMap API calls for the "ת"ת קרית מלך" desktop app (Electron).
    // GovMap tokens are bound to a domain and the app (file://) has none, so the
    // app loads this page (ys109881-rgb.github.io) in a hidden iframe and sends
    // requests via postMessage. The token arrives with each request from the
    // app's settings and is not stored in this page.
    //
    // Requests go straight to the search endpoint rather than through
    // govmap.api.js: its govmap.search() debounces and cancels overlapping
    // calls, which would leave concurrent app requests unanswered.

    // Pages allowed to use this bridge:
    //   file://                - the packaged app (loaded with loadFile)
    //   http://localhost:5173  - the app in development (Vite dev server)
    const ALLOWED_ORIGINS = ['file://', 'http://localhost:5173'];

    const SEARCH_URL = 'https://www.govmap.gov.il/api/search-service/api-search';

    const COMMANDS = {
      // { apiKey, searchText, maxResults?, isAccurate?, language? } -> { results, resultsCount, aggregations }
      search: async (p) => {
        const res = await fetch(SEARCH_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            searchText: p.searchText,
            apiKey: p.apiKey,
            language: p.language || 'he',
            maxResults: p.maxResults || 5,
            isAccurate: !!p.isAccurate,
          }),
        });
        const body = await res.json().catch(() => null);
        if (!res.ok) {
          const err = new Error((body && body.message) || `HTTP ${res.status}`);
          err.status = res.status;
          throw err;
        }
        return body;
      },
    };

    // Replies go to the parent window only. A file:// parent cannot be named as
    // a postMessage target origin, so '*' is used for it.
    function postToParent(message, origin) {
      const target = origin && origin.startsWith('http') ? origin : '*';
      window.parent.postMessage({ source: 'govmap-page', ...message }, target);
    }

    window.addEventListener('message', async (event) => {
      if (!ALLOWED_ORIGINS.includes(event.origin) || event.source !== window.parent) return;
      const msg = event.data;
      if (!msg || msg.source !== 'tat-app' || typeof msg.command !== 'string') return;

      const reply = (body) => postToParent({ type: 'result', id: msg.id, ...body }, event.origin);
      const handler = Object.prototype.hasOwnProperty.call(COMMANDS, msg.command) ? COMMANDS[msg.command] : null;
      if (!handler) return reply({ ok: false, status: 0, error: `Unknown command: ${msg.command}` });

      try {
        reply({ ok: true, result: await handler(msg.params || {}) });
      } catch (err) {
        // status 0 = network failure (no response from GovMap)
        reply({ ok: false, status: err.status || 0, error: String((err && err.message) || err) });
      }
    });

    postToParent({ type: 'ready' });
  </script>
</head>
<body></body>
</html>
